name: Release build

on:
  workflow_dispatch

jobs:
  build:
    name: Release build (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "::set-output name=sha::$(echo $(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*'))"
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@main
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd gl4es
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib

      - name: Push gl4es
        if: false && github.event != 'pull_request' && github.ref_name == 'main' && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push

      - name: Get JRE8
        run: |
          mkdir -p depends
          curl -L -o depends/jre8-ios-aarch64.tar.xz "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-40df388/jre8-arm64-20220811-release.tar.xz"

      - name: Get JRE17
        run: |
          mkdir -p depends
          curl -L -o depends/jre17-ios-aarch64.tar.xz "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-ca01427/jre17-arm64-20220817-release.tar.xz"

      - name: Get JRE21
        run: |
          mkdir -p depends
          echo "Skipping JRE21 - not needed"

      - name: Install gmake
        run: brew install make

      - name: Install JDK 8
        run: |
          brew install --cask temurin@8
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 1.8)" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Replace branding in localizations
        run: |
          find . -name "Localizable.strings" -exec sed -i '' 's/PojavLauncher/MaLauncher/g' {} \;

      - name: Build for iOS
        run: |
          export RUNNER=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2

      - name: Upload MaLauncher.ipa
        uses: actions/upload-artifact@main
        with:
          name: MaLauncher.ipa
          path: artifacts/com.tomatheloser.malauncher-*-ios.ipa

      - name: Upload MaLauncher.dSYM
        uses: actions/upload-artifact@main
        with:
          name: MaLauncher.dSYM
          path: artifacts/MaLauncher.dSYM
